<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>webhands demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="view"><div id="videoWrap" class="videoWrap"><video id="video" muted playsinline></video><canvas id="overlay"></canvas></div></div>
      <div class="view" id="scene"></div>
      <aside>
        <nav>One camera · <a href="./cameras.html">Several cameras</a> · <a href="./xr.html">WebXR</a></nav>
        <h1>webhands</h1>
        <p class="hint">Monocular 3D hands: MediaPipe + perspective-n-point.</p>
        <button id="start" class="primary">Start camera</button>

        <h2>Camera</h2>
        <label>Device <select id="camera"></select></label>
        <label><span>Mirror video</span><input id="mirror" type="checkbox" checked /></label>
        <label>Placement <select id="depthMethod"><option value="skeleton">Palm + bone rays</option><option value="pnp">All joints (PnP)</option><option value="bones">Flattest bones</option></select></label>
        <label><span>Solve rotation too (PnP)</span><input id="refine" type="checkbox" /></label>
        <p class="hint legend"><span style="background:#3ccf6e"></span>MediaPipe 2D <span style="background:#ff5a4f;margin-left:8px"></span>3D reprojected</p>

        <h2>Calibration</h2>
        <!-- The library's drop-in calibration panel (createCalibrationPanel). -->
        <div id="calibration"></div>

        <h2>Tracking</h2>
        <div id="readout">–</div>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
